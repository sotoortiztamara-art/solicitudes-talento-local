/* Lista desplegable propia: un botón que abre las opciones; guarda el valor en un input oculto */
/*
 * opciones: textos, o {valor, texto} cuando lo que se guarda es distinto de lo que se ve.
 * cfg: { etiqueta: id del texto que la nombra, ariaLabel, id: id del input oculto, disabled, clase }
 * Al elegir, avisa con el evento "cambio" (detail: {nombre, valor}).
 */
function listaDesplegable(nombre, opciones, valor, textoVacio, cfg) {
  cfg = cfg || {};
  const lista = opciones.map(o => typeof o === 'object' ? o : { valor: o, texto: o });
  valor = valor == null ? '' : String(valor);
  if (valor && !lista.some(o => o.valor === valor)) lista.unshift({ valor: valor, texto: valor });   // el valor actual aunque ya no esté en la lista
  const elegida = lista.find(o => o.valor === valor);
  return '<div class="lista-desp' + (cfg.clase ? ' ' + cfg.clase : '') + '" data-lista="' + esc(nombre) + '">' +
    '<input type="hidden" name="' + esc(nombre) + '"' + (cfg.id ? ' id="' + esc(cfg.id) + '"' : '') + ' value="' + esc(valor) + '">' +
    '<button type="button" class="entrada lista-btn" aria-haspopup="listbox" aria-expanded="false"' +
      (cfg.etiqueta ? ' aria-labelledby="' + cfg.etiqueta + '"' : '') + (cfg.ariaLabel ? ' aria-label="' + esc(cfg.ariaLabel) + '"' : '') + (cfg.disabled ? ' disabled' : '') + '>' +
      '<span class="' + (elegida ? '' : 'vacia') + '">' + esc(elegida ? elegida.texto : textoVacio) + '</span></button>' +
    '<ul class="lista-opciones" role="listbox" hidden>' +
      lista.map(o => '<li role="option" data-valor="' + esc(o.valor) + '" aria-selected="' + (o.valor === valor) + '">' + esc(o.texto) + '</li>').join('') +
    '</ul></div>';
}
function abrirLista(caja) {
  cerrarListas(caja);
  const ul = caja.querySelector('.lista-opciones'), btn = caja.querySelector('.lista-btn');
  ul.hidden = false; btn.setAttribute('aria-expanded', 'true');
  const sel = ul.querySelector('[aria-selected="true"]') || ul.querySelector('li');
  $$('li', ul).forEach(li => li.classList.toggle('activa', li === sel));
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}
function cerrarListas(excepto) {
  $$('.lista-desp').forEach(c => {
    if (c === excepto) return;
    const ul = c.querySelector('.lista-opciones');
    if (ul && !ul.hidden) { ul.hidden = true; c.querySelector('.lista-btn').setAttribute('aria-expanded', 'false'); }
  });
}
function elegirEnLista(caja, li) {
  const v = li.dataset.valor;
  caja.querySelector('input[type="hidden"]').value = v;
  const span = caja.querySelector('.lista-btn span');
  span.textContent = li.textContent; span.className = '';
  $$('li', caja).forEach(x => x.setAttribute('aria-selected', x === li));
  cerrarListas();
  caja.querySelector('.lista-btn').focus();
  caja.dispatchEvent(new CustomEvent('cambio', { bubbles: true, detail: { nombre: caja.dataset.lista, valor: v } }));
}
/* Qué hacer cuando cambia una lista: filtros de arriba y limpiar errores de formularios */
document.addEventListener('cambio', ev => {
  const d = ev.detail || {};
  if (d.nombre === 'f-estado' || d.nombre === 'm-estado') { S.estado = d.valor; otrosFiltros(d.nombre); renderContenido(); }
  else if (d.nombre === 'f-prioridad' || d.nombre === 'm-prioridad') { S.prioridad = d.valor; otrosFiltros(d.nombre); renderContenido(); }
  const form = ev.target.closest && ev.target.closest('form');
  if (form) { const e = form.querySelector('[data-error="' + d.nombre + '"]'); if (e) e.textContent = ''; }
});
/* Al cambiar un filtro en la barra se actualiza la ventana del mes, y al revés (sin redibujar la lista que se está usando) */
function otrosFiltros(nombre) {
  if (nombre.charAt(0) === 'm') renderHerramientas();
  else if (S.cal.modal) renderMesFiltros();
}
/* Pone el foco en un campo; si es una lista propia, en su botón */
function enfocarCampo(form, nombre) {
  const el = form.querySelector('[name="' + nombre + '"]');
  if (!el) return;
  if (el.type === 'hidden') { const b = el.closest('.lista-desp') && el.closest('.lista-desp').querySelector('.lista-btn'); if (b) b.focus(); }
  else el.focus();
}
document.addEventListener('keydown', ev => {
  const caja = ev.target.closest && ev.target.closest('.lista-desp');
  if (!caja) return;
  const ul = caja.querySelector('.lista-opciones');
  const items = $$('li', ul);
  if (!items.length) return;
  let i = items.findIndex(li => li.classList.contains('activa'));
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    if (ul.hidden) { abrirLista(caja); return; }
    i = ev.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
    items.forEach((li, k) => li.classList.toggle('activa', k === i));
    items[i].scrollIntoView({ block: 'nearest' });
  } else if ((ev.key === 'Enter' || ev.key === ' ') && !ul.hidden && i >= 0) {
    ev.preventDefault(); elegirEnLista(caja, items[i]);
  } else if (ev.key === 'Escape' && !ul.hidden) {
    ev.preventDefault(); ev.stopPropagation(); cerrarListas(); caja.querySelector('.lista-btn').focus();
  } else if (ev.key === 'Tab') {
    cerrarListas();
  }
}, true);

function generarClave() {
  const sil = ['ta', 'le', 'lo', 'ca', 'mi', 'no', 'ri', 'su', 've', 'pa', 'do', 'fe', 'ru', 'ne'];
  let p = '';
  for (let i = 0; i < 3; i++) p += sil[Math.floor(Math.random() * sil.length)];
  return p.charAt(0).toUpperCase() + p.slice(1) + '-' + (1000 + Math.floor(Math.random() * 9000));
}

      '<label class="campo"><span>Nueva contraseña</span><input class="entrada" type="password" name="nueva" autocomplete="new-password"><small>Mínimo 6 caracteres.</small></label>' +
      '<div class="mensaje-error" id="clave-error" hidden></div></div>' +
    '<footer><button type="button" class="btn" data-acc="cerrar-modal">Cancelar</button><button class="btn btn-primario" type="submit" id="btn-clave">Cambiar contraseña</button></footer></form></div>';
  const form = $('#form-clave');
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    try {
      await ocupado($('#btn-clave'), 'Guardando…', () => conToken('cambiarMiClave', form.actual.value, form.nueva.value));
      cerrarModal(); toast('Contraseña cambiada.');
    } catch (e) { const er = $('#clave-error'); er.textContent = msgError(e); er.hidden = false; }
  });
  setTimeout(() => form.actual.focus(), 30);
}

/* =====================================================================
   MENÚ DE USUARIO
   ===================================================================== */
function alternarMenu(abrir) {
  const m = $('#menu-usuario'), b = $('#btn-usuario');
  const ver = abrir === undefined ? m.hidden : abrir;
  if (ver) {
    const adm = nivel() >= 4;
    m.innerHTML = '<div style="padding:8px 10px 6px"><b style="font-weight:500">' + esc(S.datos.yo.nombre) + '</b><div style="font-size:13px;color:var(--tinta-3)">' + esc(S.datos.yo.email) + '</div><div style="font-size:13px;color:var(--tinta-3)">Rol: ' + esc(S.datos.yo.rol) + '</div></div><hr>' +
      (adm ? '<button data-acc="usuarios">' + ico('personas') + 'Personas y accesos</button><button data-acc="config">' + ico('ajustes') + 'Configuración</button><hr>' : '') +
      '<button data-acc="clave">' + ico('llave') + 'Cambiar mi contraseña</button><button data-acc="salir">' + ico('salir') + 'Salir</button>';
  }
  m.hidden = !ver; b.setAttribute('aria-expanded', ver);
}

/* =====================================================================
   EVENTOS (un solo manejador para todo)
   ===================================================================== */
/* Solo cuenta como "clic afuera" si el clic empezó afuera (así no se cierra al seleccionar texto y soltar fuera) */
let veloPulsado = null;
document.addEventListener('mousedown', ev => {
  const t = ev.target;
  veloPulsado = (t.classList && t.classList.contains('modal-velo')) ? t : null;
});

document.addEventListener('click', async ev => {
  const t = ev.target;

  // listas desplegables propias
  const opcion = t.closest('.lista-opciones li');
  if (opcion) { elegirEnLista(opcion.closest('.lista-desp'), opcion); return; }
  const btnLista = t.closest('.lista-btn');
  if (btnLista) {
    const caja = btnLista.closest('.lista-desp');
    if (caja.querySelector('.lista-opciones').hidden) abrirLista(caja); else cerrarListas();
    return;
  }
  cerrarListas();

  // clic afuera de una ventana: se cierra sin guardar
  if (t.classList && t.classList.contains('modal-velo') && t === veloPulsado && t.parentElement) {
    if (t.parentElement.id === 'capa-modal') { if (!S.procesando) cerrarModal(); return; }
    if (t.parentElement.id === 'capa-mes') { cerrarMes(); return; }
  }

  // cerrar menús al hacer clic fuera
  if (!t.closest('#menu-usuario') && !t.closest('#btn-usuario') && !$('#menu-usuario').hidden) alternarMenu(false);
  if (S.panelPersonas && !t.closest('#panel-personas') && !t.closest('[data-personas]')) { S.panelPersonas = ''; refrescarFiltros(); }

  if (t.closest('#btn-usuario')) { alternarMenu(); return; }
  const btnPers = t.closest('[data-personas]');
  if (btnPers) { const d = btnPers.dataset.personas; S.panelPersonas = S.panelPersonas === d ? '' : d; S.buscarPersona = ''; refrescarFiltros(); return; }

  const vista = t.closest('[data-vista]');
  if (vista) { S.vista = vista.dataset.vista; renderHerramientas(); renderContenido(); return; }

  const calBtn = t.closest('[data-cal]');
  if (calBtn) { accionCalendario(calBtn.dataset.cal); return; }
  const celda = t.closest('.celda[data-dia]');
  if (celda && !t.closest('.evento')) { S.cal.abierto = S.cal.abierto === celda.dataset.dia ? null : celda.dataset.dia; renderMes(); return; }

  const plegar = t.closest('[data-plegar]');
  if (plegar) { S[plegar.dataset.plegar] = !S[plegar.dataset.plegar]; renderFila(); return; }

  const mover = t.closest('[data-mover]');
  if (mover) {
    ev.stopPropagation();
    if (mover.disabled) return;
    try { aplicarDatos(await ocupado(mover, '…', () => conToken('moverEnFila', mover.dataset.id, mover.dataset.mover))); }
    catch (e) { toast(msgError(e), true); }
    return;
  }

  const gEstado = t.closest('[data-g-estado]');
  if (gEstado) { const box = $('#gestion'); box.dataset.estado = gEstado.dataset.gEstado; $$('[data-g-estado]', box).forEach(b => b.setAttribute('aria-pressed', b === gEstado)); return; }
  const verClave = t.closest('[data-ver-clave]');
  if (verClave) { const i = verClave.dataset.verClave; const span = $('[data-clave="' + i + '"]'); const ver = verClave.textContent === 'Ver'; span.textContent = ver ? USUARIOS[i].clave : '••••••'; verClave.textContent = ver ? 'Ocultar' : 'Ver'; return; }
  const editU = t.closest('[data-editar-usuario]');
  if (editU) { renderUsuarios(USUARIOS[editU.dataset.editarUsuario]); $('#form-usuario').scrollIntoView({ block: 'start' }); return; }

  const chk = t.closest('[data-persona]');
  if (chk && t.tagName === 'INPUT') {
    const gente = personasConPedidos();
    if (chk.dataset.persona === '*') {
      const todos = gente.every(p => !S.excluidos.has(p.email));
      S.excluidos = todos ? new Set(gente.map(p => p.email)) : new Set();
    } else {
      const e = chk.dataset.persona;
      if (chk.checked) S.excluidos.delete(e); else S.excluidos.add(e);
    }
    refrescarFiltros(); renderContenido(); return;
  }

  const acc = t.closest('[data-acc]');
  if (acc) {
    const a = acc.dataset.acc;
    if (a === 'nuevo') return abrirFormulario(null);
    if (a === 'recargar') { try { aplicarDatos(await ocupado(acc, '…', () => conToken('cargarDatos'))); toast('Actualizado.'); } catch (e) { toast(msgError(e), true); } return; }
    if (a === 'cerrar-cajon') return cerrarCajon();
    if (a === 'cerrar-modal') return cerrarModal();
    if (a === 'cerrar-personas') { S.panelPersonas = ''; refrescarFiltros(); return; }
    if (a === 'solo-yo') { S.excluidos = new Set(personasConPedidos().map(p => p.email).filter(e => e !== S.datos.yo.email)); S.panelPersonas = ''; refrescarFiltros(); renderContenido(); return; }
    if (a === 'ver-mes') return abrirMes();
    if (a === 'cerrar-mes') return cerrarMes();
    if (a === 'usuarios') { alternarMenu(false); return abrirUsuarios(); }
    if (a === 'config') { alternarMenu(false); return abrirConfig(); }
    if (a === 'clave') { alternarMenu(false); return abrirCambioClave(); }
    if (a === 'salir') { alternarMenu(false); try { await api('cerrarSesion', S.token); } catch (e) {} guardarToken(null); S.token = null; S.datos = null; cerrarCapas(); mostrarLogin(); return; }
    if (a === 'generar-clave') { $('#form-usuario [name="clave"]').value = generarClave(); return; }
    if (a === 'cancelar-usuario') return renderUsuarios(null);
    if (a === 'guardar-gestion') return guardarGestion(acc);
    if (a === 'editar') { const s = S.datos.solicitudes.find(x => x.id === S.detalleId); return abrirFormulario(s); }
    if (a === 'comentar') {
      const txt = $('#nuevo-comentario').value.trim();
      if (!txt) { $('#nuevo-comentario').focus(); return; }
      try { S.detalleExtra = await ocupado(acc, 'Enviando…', () => conToken('agregarComentario', S.detalleId, txt)); renderDetalle(true); const s = S.datos.solicitudes.find(x => x.id === S.detalleId); if (s) { s.comentarios = S.detalleExtra.comentarios.length; renderContenido(); } }
      catch (e) { toast(msgError(e), true); }
      return;
    }
    if (a === 'retirar') {
      if (!await confirmar('Retirar solicitud', 'La solicitud sale de la fila y queda como retirada. ¿Seguro?', 'Retirar solicitud')) return;
      try { aplicarDatos(await conToken('retirarSolicitud', S.detalleId)); toast('Solicitud retirada.'); } catch (e) { toast(msgError(e), true); }
      return;
    }
    if (a === 'eliminar') {
      const id = S.detalleId;
      if (!await confirmar('Eliminar ' + id, 'Se borra de la planilla y no se puede recuperar. El historial queda guardado.', 'Eliminar')) return;
      try { aplicarDatos(await conToken('eliminarSolicitud', id)); cerrarCajon(); toast(id + ' eliminada.'); } catch (e) { toast(msgError(e), true); }
      return;
    }
  }

  const abrir = t.closest('[data-abrir]');
  if (abrir && !t.closest('.cajon') && !t.closest('a')) { abrirDetalle(abrir.dataset.abrir); return; }

  if (t.matches('[data-cerrar-cajon]')) { if (!S.procesando) cerrarCajon(); return; }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if ($('#capa-confirmar').innerHTML) { $('#capa-confirmar').innerHTML = ''; return; }
    if (S.panelPersonas) { S.panelPersonas = ''; refrescarFiltros(); return; }
    if ($('#capa-modal').innerHTML) { if (!S.procesando) cerrarModal(); return; }
    if (!$('#menu-usuario').hidden) { alternarMenu(false); return; }
    if (S.detalleId) { if (!S.procesando) cerrarCajon(); return; }
    if (S.cal.modal) { cerrarMes(); return; }
  }
  if (ev.key === 'Enter' && ev.target.matches('.fila[data-abrir], .tarjeta[data-abrir]')) abrirDetalle(ev.target.dataset.abrir);
});

/* Actualización automática cada 2 minutos (si la pestaña está visible y no hay formularios abiertos) */
setInterval(async () => {
  if (!S.token || !S.datos || document.hidden || $('#capa-modal').innerHTML || S.panelPersonas || S.detalleId) return;
  if (document.activeElement && document.activeElement.matches('textarea, input')) return;
  try { aplicarDatos(await conToken('cargarDatos')); } catch (e) {}
}, 120000);

iniciar();
</script>
